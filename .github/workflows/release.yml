name: CamiTune CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: camitune-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Find an existing build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      artifact_name: CamiTune-app-universal-macos11-${{ steps.source.outputs.tree }}
      run_id: ${{ steps.existing.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source commit and validate tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.3.1."
            exit 1
          fi
      - name: Find a successful build of identical source
        id: existing
        uses: actions/github-script@v8
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        with:
          script: |
            const tree = process.env.SOURCE_TREE;
            const name = `CamiTune-app-universal-macos11-${tree}`;
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'release.yml'
            });
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name, per_page: 100
            });
            for (const artifact of artifacts) {
              if (artifact.name !== name || artifact.expired || !artifact.workflow_run) continue;
              const {data: run} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id
              });
              const trustedPush = run.event === 'push' &&
                (run.head_branch === 'main' || /^v[0-9]+\.[0-9]+\.[0-9]+$/.test(run.head_branch));
              const trustedDispatch = run.event === 'workflow_dispatch' && run.head_branch === 'main';
              if (run.workflow_id !== workflow.id || run.conclusion !== 'success' ||
                  run.head_repository?.id !== Number(process.env.GITHUB_REPOSITORY_ID) ||
                  !(trustedPush || trustedDispatch)) continue;
              const {data: commit} = await github.rest.git.getCommit({
                ...context.repo, commit_sha: run.head_sha
              });
              if (commit.tree.sha !== tree) continue;
              core.setOutput('run_id', String(run.id));
              core.info(`Reusing ${name} from successful run ${run.id} (commit ${run.head_sha}).`);
              return;
            }
            core.info('No retained successful build of this source tree; building it now.');

  build:
    name: Build application
    needs: prepare
    if: needs.prepare.outputs.run_id == ''

    runs-on: macos-26

    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "Rust deployment target: $(rustc --print=deployment-target)"
          key="$({ xcodebuild -version; xcrun --sdk macosx --show-sdk-version; rustc -vV; cargo --version; } | shasum -a 256 | awk '{print $1}')"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Verify SwiftPM and Xcode source ownership
        run: python3 Scripts/verify-source-targets.py --require-modules

      - name: Prepare Rust targets for Intel and Apple Silicon
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore native helpers and Rust compilation cache
        uses: actions/cache@v5
        with:
          path: |
            build/camilladsp
            build/driver
            build/plugin-host
            build/login-item
            build/speaker-eq
            ~/.cargo/registry
            ~/.cargo/git
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-macos11-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Tools/**', 'Drivers/SystemAudioBridge/**', 'Sources/SystemAudioBridgeC/include/**', 'Contributions/CamillaDSP/*.patch', 'Scripts/**') }}
          restore-keys: |
            native-v2-${{ runner.os }}-${{ runner.arch }}-macos11-${{ steps.toolchain.outputs.key }}-

      - name: Restore Xcode compilation and package cache
        uses: actions/cache@v5
        with:
          path: dist/DerivedData
          key: xcode-v2-${{ runner.os }}-${{ runner.arch }}-macos11-${{ steps.toolchain.outputs.key }}-${{ needs.prepare.outputs.source_tree }}
          restore-keys: |
            xcode-v2-${{ runner.os }}-${{ runner.arch }}-macos11-${{ steps.toolchain.outputs.key }}-

      - name: Build application
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build-app.sh

      - name: Verify every binary architecture targets macOS 11
        run: python3 Scripts/verify-macos-deployment.py dist/CamiTune.app --macos 11.0 --architectures arm64 x86_64

      - name: Verify Release bundle
        shell: bash
        run: |
          set -euo pipefail
          app="dist/CamiTune.app"
          executable="$app/Contents/MacOS/CamiTune"
          resources="$app/Contents/Resources"
          expected_version="${GITHUB_REF_NAME#v}"

          test -d "$app" || { echo "::error::Missing $app"; exit 1; }
          test -x "$executable" || { echo "::error::Missing app executable"; exit 1; }
          test -s "$resources/icon.png" || { echo "::error::Missing icon.png"; exit 1; }
          test -s "$resources/LICENSE" || { echo "::error::Missing LICENSE"; exit 1; }
          test -x "$resources/Helpers/camitune-speaker-eq" || { echo "::error::Missing Speaker Auto EQ helper"; exit 1; }
          test -s "$resources/Helpers/THIRD_PARTY_NOTICES.txt" || { echo "::error::Missing speaker helper notices"; exit 1; }
          test -s "$resources/THIRD_PARTY.md" || { echo "::error::Missing THIRD_PARTY.md"; exit 1; }
          test -d "$resources/DeviceCorrectionTargets" || { echo "::error::Missing DeviceCorrectionTargets"; exit 1; }
          test -d "$resources/Drivers/CamillaAudio.driver" || { echo "::error::Missing bundled audio driver"; exit 1; }
          test -x "$resources/CamillaDSP/camilladsp" || { echo "::error::Missing bundled CamillaDSP"; exit 1; }

          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$bundle_version" != "$expected_version" ]]; then
            echo "::error::Bundle version $bundle_version does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

          echo "=== Application ==="
          file "$executable"
          echo "=== Linked libraries ==="
          otool -L "$executable"
          echo "=== Signature ==="
          codesign --display --verbose=4 "$app"

      - name: Save reusable application build
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          mkdir -p build-artifact
          ditto -c -k --sequesterRsrc --keepParent dist/CamiTune.app build-artifact/CamiTune-app.zip
          printf '%s\n' "$SOURCE_SHA" > build-artifact/SOURCE_COMMIT
          printf '%s\n' "$SOURCE_TREE" > build-artifact/SOURCE_TREE
          cd build-artifact
          shasum -a 256 CamiTune-app.zip SOURCE_COMMIT SOURCE_TREE > SHA256SUMS

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k CamiTune-app.zip "$tmp"
          codesign --verify --deep --strict --verbose=4 "$tmp/CamiTune.app"
          shasum -a 256 -c SHA256SUMS

      - name: Upload application build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  release:
    name: Publish GitHub Release
    if: >-
      always() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.prepare.outputs.run_id != ''))
    needs: [prepare, build]
    # Reusing an app needs no compiler, but stamping the version and signing its
    # bundle still require macOS. The original compiled executables are retained.
    runs-on: macos-26
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download application build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: build-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}

      - name: Prepare tagged application
        shell: bash
        env:
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          cd build-artifact
          shasum -a 256 -c SHA256SUMS
          test "$(cat SOURCE_TREE)" = "$SOURCE_TREE" || {
            echo "::error::Downloaded application was built from different source."
            exit 1
          }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k CamiTune-app.zip "$tmp"
          app="$tmp/CamiTune.app"
          codesign --verify --deep --strict --verbose=4 "$app"
          python3 ../Scripts/verify-macos-deployment.py "$app" --macos 11.0 --architectures arm64 x86_64

          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"

          mkdir -p ../release-files
          archive="CamiTune-${GITHUB_REF_NAME}-app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "../release-files/$archive"
          cd ../release-files
          shasum -a 256 "$archive" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish GitHub Release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "CamiTune-${GITHUB_REF_NAME}-app.zip" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CamiTune $GITHUB_REF_NAME"
