name: CamiTune CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: camitune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Find an existing build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.existing.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source commit and validate tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.3.1."
            exit 1
          fi
      - name: Find a successful main build for this commit
        id: existing
        if: github.ref_type == 'tag'
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            const name = `CamiTune-app-${sha}`;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'release.yml', event: 'push',
              branch: 'main', head_sha: sha, status: 'success', per_page: 100
            });
            for (const run of runs) {
              if (run.head_sha !== sha || run.head_branch !== 'main' ||
                  run.event !== 'push' || run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info(`Reusing ${name} from successful run ${run.id}.`);
                return;
              }
            }
            core.info('No retained successful main build for this commit; building it now.');

  build:
    name: Build application
    needs: prepare
    if: needs.prepare.outputs.run_id == ''

    # GitHub-hosted macOS 13 runners were retired in December 2025.
    # Build on a supported Apple-silicon runner and explicitly target Ventura.
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 15.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          echo "Rust deployment target: $(rustc --print=deployment-target)"

      - name: Verify SwiftPM and Xcode source ownership
        run: python3 Scripts/verify-source-targets.py --require-modules

      - name: Restore audio component cache
        uses: actions/cache@v5
        with:
          path: |
            build/camilladsp/camilladsp
            build/camilladsp/build-key
            build/driver/CamillaAudio.driver
            build/driver/build-key
          # Include the Ventura deployment target/Xcode version so binaries
          # previously built on a newer macOS runner can never be reused.
          key: audio-components-${{ runner.os }}-${{ runner.arch }}-macos13-xcode15.2-${{ hashFiles('Contributions/CamillaDSP/*.patch', 'Drivers/SystemAudioBridge/Driver/**', 'Drivers/SystemAudioBridge/Shared/**', 'Sources/SystemAudioBridgeC/include/**', 'Drivers/SystemAudioBridge/build-driver.sh', 'Scripts/embed-audio-components.sh') }}

      - name: Build application
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: ./build-app.sh

      - name: Verify macOS 13 compatibility
        shell: bash
        run: |
          set -euo pipefail

          app="dist/CamiTune.app"
          executable="$app/Contents/MacOS/CamiTune"
          camilladsp="$app/Contents/Resources/CamillaDSP/camilladsp"
          driver="$app/Contents/Resources/Drivers/CamillaAudio.driver/Contents/MacOS/CamillaAudio"

          check_minos() {
            local binary="$1"
            local label="$2"
            local minos

            test -x "$binary" || {
              echo "::error::Missing executable for deployment-target check: $binary"
              exit 1
            }

            # Consume all otool output: exiting awk early can break the pipe
            # and fail this check under pipefail even for a valid binary.
            minos="$(otool -l "$binary" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build = 1; old = 0; next }
              build && $1 == "minos" && !found { print $2; found = 1 }
              $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { old = 1; build = 0; next }
              old && $1 == "version" && !found { print $2; found = 1 }
            ')"

            if [[ -z "$minos" ]]; then
              echo "::error::Could not determine minimum macOS version for $label ($binary)."
              exit 1
            fi

            echo "$label minimum macOS: $minos"

            /usr/bin/python3 - "$label" "$minos" <<'PY'
          import sys

          label, version = sys.argv[1], sys.argv[2]
          parts = version.split('.')
          parsed = tuple(int(p) for p in parts[:3])
          parsed += (0,) * (3 - len(parsed))

          if parsed > (13, 0, 0):
              print(f"::error::{label} requires macOS {version}; expected macOS 13.0 or earlier.")
              raise SystemExit(1)
          PY
          }

          test -d "$app" || { echo "::error::Missing $app"; exit 1; }

          plist_minos="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          echo "App Info.plist minimum macOS: $plist_minos"
          if [[ "$plist_minos" != "13.0" ]]; then
            echo "::error::LSMinimumSystemVersion is $plist_minos; expected 13.0."
            exit 1
          fi

          check_minos "$executable" "CamiTune"
          check_minos "$app/Contents/Resources/Helpers/camitune-speaker-eq" "Speaker Auto EQ"
          check_minos "$camilladsp" "CamillaDSP"
          check_minos "$driver" "System Audio Bridge"

      - name: Verify Release bundle
        shell: bash
        run: |
          set -euo pipefail
          app="dist/CamiTune.app"
          executable="$app/Contents/MacOS/CamiTune"
          resources="$app/Contents/Resources"
          expected_version="${GITHUB_REF_NAME#v}"

          test -d "$app" || { echo "::error::Missing $app"; exit 1; }
          test -x "$executable" || { echo "::error::Missing app executable"; exit 1; }
          test -s "$resources/icon.png" || { echo "::error::Missing icon.png"; exit 1; }
          test -s "$resources/LICENSE" || { echo "::error::Missing LICENSE"; exit 1; }
          test -x "$resources/Helpers/camitune-speaker-eq" || { echo "::error::Missing Speaker Auto EQ helper"; exit 1; }
          test -s "$resources/Helpers/THIRD_PARTY_NOTICES.txt" || { echo "::error::Missing speaker helper notices"; exit 1; }
          test -s "$resources/THIRD_PARTY.md" || { echo "::error::Missing THIRD_PARTY.md"; exit 1; }
          test -d "$resources/DeviceCorrectionTargets" || { echo "::error::Missing DeviceCorrectionTargets"; exit 1; }
          test -d "$resources/Drivers/CamillaAudio.driver" || { echo "::error::Missing bundled audio driver"; exit 1; }
          test -x "$resources/CamillaDSP/camilladsp" || { echo "::error::Missing bundled CamillaDSP"; exit 1; }

          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$bundle_version" != "$expected_version" ]]; then
            echo "::error::Bundle version $bundle_version does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

          echo "=== Application ==="
          file "$executable"
          echo "=== Linked libraries ==="
          otool -L "$executable"
          echo "=== Signature ==="
          codesign --display --verbose=4 "$app"

      - name: Save reusable application build
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build-artifact
          ditto -c -k --sequesterRsrc --keepParent dist/CamiTune.app build-artifact/CamiTune-app.zip
          printf '%s\n' "$SOURCE_SHA" > build-artifact/SOURCE_COMMIT
          cd build-artifact
          shasum -a 256 CamiTune-app.zip SOURCE_COMMIT > SHA256SUMS

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k CamiTune-app.zip "$tmp"
          codesign --verify --deep --strict --verbose=4 "$tmp/CamiTune.app"
          shasum -a 256 -c SHA256SUMS

      - name: Upload application build
        uses: actions/upload-artifact@v7
        with:
          name: CamiTune-app-${{ needs.prepare.outputs.source_sha }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    if: >-
      always() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.prepare.outputs.run_id != ''))
    needs: [prepare, build]
    # Reusing an app needs no compiler, but stamping the version and signing its
    # bundle still require macOS. The original compiled executables are retained.
    runs-on: macos-14
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download application build
        uses: actions/download-artifact@v8
        with:
          name: CamiTune-app-${{ needs.prepare.outputs.source_sha }}
          path: build-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}

      - name: Prepare tagged application
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd build-artifact
          shasum -a 256 -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$SOURCE_SHA" || {
            echo "::error::Downloaded application was built from a different commit."
            exit 1
          }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k CamiTune-app.zip "$tmp"
          app="$tmp/CamiTune.app"
          codesign --verify --deep --strict --verbose=4 "$app"

          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"

          mkdir -p ../release-files
          archive="CamiTune-${GITHUB_REF_NAME}-app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "../release-files/$archive"
          cd ../release-files
          shasum -a 256 "$archive" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish GitHub Release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "CamiTune-${GITHUB_REF_NAME}-app.zip" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CamiTune $GITHUB_REF_NAME"
