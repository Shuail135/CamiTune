name: CamiTune CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camitune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build application
    runs-on: macos-13

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore audio component cache
        uses: actions/cache@v5
        with:
          path: |
            build/camilladsp/camilladsp
            build/camilladsp/build-key
            build/driver/CamillaAudio.driver
            build/driver/build-key
          key: audio-components-${{ runner.os }}-${{ runner.arch }}-camilladsp-05e9cfcdf43c0dfe078ed3feb8af4c8bd701fd74-${{ hashFiles('Contributions/CamillaDSP/*.patch', 'Drivers/SystemAudioBridge/Driver/**', 'Drivers/SystemAudioBridge/Shared/**', 'Drivers/SystemAudioBridge/build-driver.sh') }}

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.3.1."
            exit 1
          fi

      - name: Build application
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build-app.sh

      - name: Verify Release bundle
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/CamiTune.app"
          executable="$app/Contents/MacOS/CamiTune"
          resources="$app/Contents/Resources"
          expected_version="${GITHUB_REF_NAME#v}"

          test -d "$app" || { echo "::error::Missing $app"; exit 1; }
          test -x "$executable" || { echo "::error::Missing app executable"; exit 1; }
          test -s "$resources/icon.png" || { echo "::error::Missing icon.png"; exit 1; }
          test -s "$resources/LICENSE" || { echo "::error::Missing LICENSE"; exit 1; }
          test -s "$resources/THIRD_PARTY.md" || { echo "::error::Missing THIRD_PARTY.md"; exit 1; }
          test -d "$resources/DeviceCorrectionTargets" || { echo "::error::Missing DeviceCorrectionTargets"; exit 1; }
          test -d "$resources/Drivers/CamillaAudio.driver" || { echo "::error::Missing bundled audio driver"; exit 1; }
          test -x "$resources/CamillaDSP/camilladsp" || { echo "::error::Missing bundled CamillaDSP"; exit 1; }

          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$bundle_version" != "$expected_version" ]]; then
            echo "::error::Bundle version $bundle_version does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

          echo "=== Application ==="
          file "$executable"
          echo "=== Linked libraries ==="
          otool -L "$executable"
          echo "=== Signature ==="
          codesign --display --verbose=4 "$app"

      - name: Package Release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="CamiTune-v${version}-app.zip"

          ditto -c -k --sequesterRsrc --keepParent dist/CamiTune.app "$archive"
          test -s "$archive" || { echo "::error::Release ZIP was not created."; exit 1; }
          shasum -a 256 "$archive" > SHA256SUMS

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k "$archive" "$tmp"
          codesign --verify --deep --strict --verbose=4 "$tmp/CamiTune.app"
          shasum -a 256 -c SHA256SUMS

      - name: Upload Release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: CamiTune-${{ github.ref_name }}
          path: |
            CamiTune-v*-app.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Release files
        uses: actions/download-artifact@v8
        with:
          name: CamiTune-${{ github.ref_name }}
          path: release-files

      - name: Verify downloaded files
        working-directory: release-files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          expected="CamiTune-${GITHUB_REF_NAME}-app.zip"
          test -s "$expected" || { echo "::error::Expected $expected"; exit 1; }

      - name: Publish GitHub Release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "CamiTune-${GITHUB_REF_NAME}-app.zip" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CamiTune $GITHUB_REF_NAME"
